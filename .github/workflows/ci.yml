name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, pgsql
          coverage: none
          tools: composer:v2

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Pint (style)
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.php')
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No PHP files changed."
              exit 0
            fi
            echo "Pint checking ${#files[@]} changed PHP file(s)"
            vendor/bin/pint --test "${files[@]}"
          else
            vendor/bin/pint --test
          fi

      - name: PHPStan / Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Composer audit
        run: composer audit --no-interaction

      - name: npm audit (if package-lock present)
        continue-on-error: true
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
            npm audit --audit-level=high
          else
            echo "No package-lock.json — skipping npm audit"
          fi

  tests:
    name: Postgres tests + RLS gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_KEY: base64:dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdGtleXRlc3Q=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: voxsign_test
      DB_USERNAME: pearledu_app
      DB_PASSWORD: secret
      TENANCY_BASE_DOMAIN: voxsign.test
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, pgsql
          coverage: none
          tools: composer:v2

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Provision non-superuser Postgres role + test DB
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'pearledu_app') THEN
              CREATE ROLE pearledu_app LOGIN PASSWORD 'secret' NOSUPERUSER NOBYPASSRLS NOCREATEDB;
            END IF;
          END
          $$;
          SELECT pg_terminate_backend(pid)
          FROM pg_stat_activity
          WHERE datname = 'voxsign_test' AND pid <> pg_backend_pid();
          DROP DATABASE IF EXISTS voxsign_test;
          CREATE DATABASE voxsign_test OWNER pearledu_app;
          SQL
          psql -h 127.0.0.1 -U postgres -d voxsign_test -v ON_ERROR_STOP=1 <<'SQL'
          GRANT ALL ON SCHEMA public TO pearledu_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO pearledu_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO pearledu_app;
          SQL

      - name: Migrate
        run: php artisan migrate --force --no-interaction

      - name: Verify RLS / role (hard gate)
        run: php artisan db:verify-security

      - name: PHPUnit
        run: php artisan test
