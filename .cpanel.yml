---
deployment:
  tasks:
    # Single task so the whole pipeline shares one shell. The previous
    # /bin/cp -R * plus chmod -R storage plus composer install on every
    # click is why cPanel sat on "deployment in progress" for so long.
    # See scripts/cpanel-deploy.sh (rsync, skip composer when lock is unchanged).
    - export DEPLOYPATH=/home/voxsignco/pearledu-app
    - /bin/bash ./scripts/cpanel-deploy.sh
